<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- link styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculator-body">
        <div class="calculator-screen">
            <div class="result">7+7+7</div>
            <div class="entered">14</div>
        </div>

        <div class="button-set">
            <div class="first-row-button">
                <button class="unused"></button>
                <button class="clear">AC</button>
                <button class="modulo">%</button>
                <button class="divide">&divide;</button>
            </div>
            <div class="second-row-button">
                <button class="seven">7</button>
                <button class="eight">8</button>
                <button class="nine">9</button>
                <button class="multiply">&times;</button>
            </div>
            <div class="third-row-button">
                <button class="four">4</button>
                <button class="five">5</button>
                <button class="six">6</button>
                <button class="subtract">&minus;</button>
            </div>
            <div class="fourth-row-button">
                <button class="one">1</button>
                <button class="two">2</button>
                <button class="three">3</button>
                <button class="add">&plus;</button>
            </div>
            <div class="fifth-row-button">
                <button class="reverse">+/-</button>
                <button class="zero">0</button>
                <button class="decimal">.</button>
                <button class="equal">&equals;</button>
            </div>
        </div>
    </div>
    <!-- link script -->
    <script src="script.js"></script>
</body>
</html>
